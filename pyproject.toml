[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timekeeper"
version = "0.1.0"
description = "Personal contractor work tracker: git + Claude Code → weekly impact reports"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "keyring>=24",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tk = "worklog.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
